name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14's default Xcode ships Swift 5.10; Package.swift needs 6.0+.
      # Select the newest Xcode already on the runner rather than hardcode
      # a version (which would go stale as GitHub updates the image) or
      # pull in a third-party action for this.
      - name: Select newest available Xcode
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build (SPM)
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Typecheck every registry component against the real iOS SDK
        run: Scripts/verify-components.sh
