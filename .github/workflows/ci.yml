name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A runner's DEFAULT Xcode selection isn't always its newest
      # installed one, and this package (plus its transitive deps) needs
      # a recent Swift 6 toolchain. Select the newest Xcode actually on
      # the runner rather than hardcode a version (goes stale as GitHub
      # updates the image) or pull in a third-party action for this.
      - name: Select newest available Xcode
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build (SPM)
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Typecheck every registry component against the real iOS SDK
        run: Scripts/verify-components.sh
